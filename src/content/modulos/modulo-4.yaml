numero: 4
slug: modulo-4
titulo: "ACV y herramientas complementarias"
subtitulo: "Ampliando la perspectiva de ciclo de vida"
fechas: "12 de agosto (miércoles)"
sesiones: "Sesión completa"
acento: verde
descripcion: >-
  Aquí conoces un conjunto de herramientas complementarias al ACV ambiental
  que te permiten evaluar otras dimensiones de la sostenibilidad: la huella de
  carbono, la huella hídrica, el Análisis de Costo de Ciclo de Vida y el
  Análisis de Ciclo de Vida Social. Ves cómo estas herramientas se relacionan
  entre sí y pueden usarse de forma complementaria para obtener una visión más
  completa de los impactos ambientales, sociales y económicos.
contenidos:
  - "Huella de carbono"
  - "Huella hídrica"
  - "Análisis de Costo de Ciclo de Vida"
  - "Análisis de Ciclo de Vida Social"

