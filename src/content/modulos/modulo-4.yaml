      - titulo: "Water Footprint Network"
        url: "https://www.waterfootprint.org/"
        tipo: "Entidad"
        idioma: "EN"
        descripcion: >-
          Organización de referencia para la metodología y el cálculo de la
          huella hídrica de productos, empresas y países.
      - titulo: "Programa Ecuador Carbono Cero (PECC)"
        url: "https://www.ambienteyenergia.gob.ec/ambiente/programa-ecuador-carbono-cero/"
        tipo: "Programa"
        descripcion: >-
          Programa del Ministerio de Ambiente para la cuantificación,
          reducción y neutralización de la huella de carbono en Ecuador.
      - titulo: "Guidelines for Social Life Cycle Assessment of Products and Organizations"
        url: "https://www.unep.org/resources/report/guidelines-social-life-cycle-assessment-products"
        tipo: "Guía"
        idioma: "EN"
        dedicacion: "~1 h"
        descripcion: >-
          Guía de referencia de PNUMA para la metodología del Análisis de Ciclo
          de Vida Social (ACV-S).
      - titulo: "Pilot Projects on Guidelines for Social Life Cycle Assessment of Products and Organizations 2022"
        url: "https://www.lifecycleinitiative.org/library/pilot-projects-on-guidelines-for-social-life-cycle-assessment-of-products-and-organizations-2022/"
        tipo: "Informe"
        idioma: "EN"
        dedicacion: "~45 min"
        descripcion: >-
          Informe de la Life Cycle Initiative y la Social LCA Alliance con 9
          casos reales de aplicación de las directrices UNEP 2020 de ACV
          Social, en sectores como automotriz, alimentario, cosmética y metales.
      - titulo: "Guía del Análisis de Ciclo de Vida Social del Sistema de Reciclaje de Cuenca"
        url: "https://drive.google.com/file/d/1PyDLDtT-_FisIYp-fB6iumm1dwsNxfqZ/view?usp=drivesdk"
        tipo: "Guía · PDF"
        dedicacion: "~30 min"
        descripcion: >-
          Guía divulgativa (2022) del Grupo de Investigación Economía Circular
          Inclusiva (DIEP-Universidad de Cuenca), en alianza con EMAC EP y
          PNUMA, que aplica el ACV Social a los recicladores y recicladoras de
          base de Cuenca. Fue uno de los 10 proyectos piloto seleccionados a
          nivel mundial en la actualización de las Guías Metodológicas de ACV
          Social de 2020, con resultados accesibles y visuales sobre
          condiciones laborales, salario, seguridad social y equidad de género.
      - titulo: "Análisis de ciclo de vida social del sistema de reciclaje informal realizado por ASERLIBER"
        url: "https://dspace.ucuenca.edu.ec/items/ad63b073-1a06-4788-89fe-2babe951e8c6"
        tipo: "Tesis · PDF"
        dedicacion: "~2 h"
        descripcion: >-
          Tesis de maestría (Lalvay Carrera, Universidad de Cuenca, 2025) que
          aplica el ACV Social siguiendo las directrices de PNUMA al reciclaje
          informal en el cantón La Libertad (Santa Elena), evaluando bienestar
          económico, seguridad laboral, equidad de género, salud ocupacional y
          otros indicadores sociales.
      - titulo: "Life Cycle Sustainability Assessment (LCSA): A comprehensive overview of existing integrated approaches to LCA, S-LCA, and LCC"
        url: "http://ecsdev.org/ojs/index.php/ejsd/article/view/1743"
        tipo: "Artículo"
        idioma: "EN"
        dedicacion: "~40 min"
        descripcion: >-
          Artículo revisado por pares y de acceso abierto (Bruno, Menichini &
          Silvestri, 2025) que revisa 66 estudios sobre cómo integrar ACV,
          Costeo de Ciclo de Vida y ACV Social en un marco único de LCSA.
      - titulo: "Life Cycle Sustainability Assessment — ScienceDirect Topics"
        url: "https://www.sciencedirect.com/topics/earth-and-planetary-sciences/life-cycle-sustainability-assessment"
        tipo: "Web"
        idioma: "EN"
        dedicacion: "~15 min"
        descripcion: >-
          Página de acceso libre con una síntesis clara y accesible del
          concepto de LCSA, como primera lectura antes de profundizar en la
          bibliografía técnica.

presentaciones:
  - titulo: "Sesión 8 — Las huellas y las otras dimensiones de la sostenibilidad"
    tipo: presentacion
    fuente: "Beatriz Rivela · 12 de agosto"
    descripcion: >-
      Qué mide cada huella y en qué se diferencian —ecológica, hídrica (agua
      azul, verde y gris; Water Footprint Network e ISO 14046), de carbono
      (GHG Protocol) y ambiental (PEF/OEF)—, la dimensión social del ciclo de
      vida siguiendo las directrices UNEP-SETAC, y el cierre con la mirada
      integral de la sostenibilidad.
    url: "/materiales/modulo-4/sesion-8-huellas-y-dimensiones-de-la-sostenibilidad.pdf"
    estado: disponible
