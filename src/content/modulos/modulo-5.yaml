referencias:
  - items:
      - titulo: "A Policymakers' Guide to Life Cycle Assessment — Policy Brief"
        url: "https://www.lifecycleinitiative.org/library/a-policymakers-guide-to-life-cycle-assessment-policy-brief/"
        tipo: "Guía"
        idioma: "EN"
        dedicacion: "~20 min"
        descripcion: >-
          Guía de la Life Cycle Initiative (PNUMA, 2024) con cuatro criterios
          para que los formuladores de política distingan un ACV riguroso y con
          ejemplos reales de gobiernos que ya usan el ACV en sus políticas de
          clima, economía circular y compras públicas.
      - titulo: "Life Cycle Assessment support to environmental ambitions of EU policies and the Sustainable Development Goals"
        url: "https://academic.oup.com/ieam/article/18/5/1221/7726960"
        tipo: "Artículo · acceso abierto"
        idioma: "EN"
        descripcion: >-
          Estudio de la Comisión Europea (Sanyé-Mengual & Sala, 2022) que
          analiza cómo el ACV respalda el Pacto Verde Europeo y los ODS,
          usando el indicador "Consumption Footprint" como caso práctico de
          monitoreo del ODS 12 e incorporando los Límites Planetarios como
          referencia de sostenibilidad absoluta.
      - titulo: "Alianza Ambiental de América (AAA)"
        url: "https://alianza-ambiental.org/"
        tipo: "Entidad"
        descripcion: >-
          Primer programa regional de etiquetado ambiental Tipo I en América
          Latina y el Caribe, impulsado por el proyecto EcoAdvance con
          participación de Ecuador.
      - titulo: "Guía para la aplicación de criterios de sostenibilidad en las compras públicas"
        url: "https://portal.compraspublicas.gob.ec/sercop/wp-content/uploads/2025/05/gui%CC%81a_para_cps_-_nro_7_final_revisada_resolucion-signed-signed.pdf"
        tipo: "Guía · PDF"
        dedicacion: "~45 min"
        descripcion: >-
          Guía oficial del SERCOP para la incorporación de criterios
          ambientales, sociales y económicos en la contratación pública
          ecuatoriana.
      - titulo: "Compras públicas sostenibles y ecoetiquetado (PNUMA)"
        url: "https://www.unep.org/es/regiones/america-latina-y-el-caribe/iniciativas-regionales/promoviendo-la-eficiencia-de-recursos"
        tipo: "Web"
        descripcion: >-
          Portal regional de PNUMA sobre compras públicas sostenibles y
          ecoetiquetado, con recursos y comunidades de práctica.
      - titulo: "ECO Platform"
        url: "https://www.eco-platform.org/"
        tipo: "Entidad"
        idioma: "EN"
        descripcion: >-
          Asociación que armoniza y conecta cerca de 20 programas de
          Declaraciones Ambientales de Producto (EPD, por sus siglas en inglés)
          de todo el mundo bajo un formato común ("Core EPD"), funcionando como
          la base de datos global de referencia para EPD de productos de
          construcción.
      - titulo: "The International EPD® System"
        url: "https://www.environdec.com/home"
        tipo: "Entidad"
        idioma: "EN"
        descripcion: >-
          El programa de Declaraciones Ambientales de Producto (DAP/EPD) más
          antiguo y operativo del mundo (fundado en 1998 por la Agencia Sueca
          de Protección Ambiental), basado en las normas ISO 14025 y EN 15804.
      - titulo: "Sustainable Public Procurement and Ecolabelling (SPPEL)"
        url: "https://www.oneplanetnetwork.org/knowledge-centre/projects/sustainable-public-procurement-and-ecolabelling-sppel"
        tipo: "Proyecto"
        idioma: "EN"
        descripcion: >-
          Proyecto de PNUMA (2013-2017) que combinó compras públicas
          sostenibles y ecoetiquetado (basado en ACV) en 13 países, incluido
          Ecuador, junto con Argentina, Brasil, Chile, Colombia, Costa Rica,
          India, Mauricio, Mongolia, Marruecos, Perú, Togo y Vietnam.
      - titulo: "Las Compras Públicas Sostenibles en América Latina"
        url: "https://ricg.org/wp-content/uploads/2020/02/Estudio-Las-Compras-Publicas-Sostenibles-en-Am%C3%A9rica-Latina.pdf"
        tipo: "Informe · PDF"
        dedicacion: "~1 h"
        descripcion: >-
          Estudio comparativo de PNUMA, la OEA y la Red Interamericana de
          Compras Gubernamentales (RICG, 2011) sobre el estado de las compras
          públicas sostenibles en distintos países de la región.
      - titulo: "LCA and Reality (Andreas Ciroth) — openLCA.conf 2026 Keynote + Q&A"
        url: "https://www.youtube.com/watch?v=ZGkjiwh77ec&t=264s"
        tipo: "Vídeo"
        idioma: "EN"
        dedicacion: "▶ 24 min"
        descripcion: >-
          Conferencia magistral de openLCA.conf 2026 (GreenDelta, Berlín) en la
          que Andreas Ciroth reflexiona críticamente sobre si el ACV logra
          representar la realidad de forma objetiva y holística, y qué retos
          quedan pendientes para acercar mejor los modelos a la práctica.
      - titulo: "World Resources Institute (WRI)"
        url: "https://es.wri.org/"
        tipo: "Entidad"
        descripcion: >-
          Think tank global de investigación ambiental que analiza tendencias
          en clima, economía circular y políticas públicas de sostenibilidad.
      - titulo: "Trellis"
        url: "https://trellis.net/"
        tipo: "Medio"
        idioma: "EN"
        descripcion: >-
          Medio de referencia sobre sostenibilidad empresarial y tendencias
          globales (economía circular, reporting ESG, regulación ambiental),
          con cobertura diaria y análisis en profundidad.

presentaciones:
  - titulo: "Sesión 9 — El ACV en las políticas públicas y el ecoetiquetado"
    tipo: presentacion
    fuente: "Beatriz Rivela · 13 de agosto"
    descripcion: >-
      Por qué el ACV sostiene mejores políticas públicas —enfoque sistémico,
      puntos críticos, unidad funcional y coherencia entre sectores—, su papel
      en las Compras Públicas Sostenibles, y la introducción al ecoetiquetado
      y la comunicación ambiental: etiquetas Tipo I, II y III y Declaraciones
      Ambientales de Producto.
    url: "/materiales/modulo-5/sesion-9-acv-en-politicas-publicas-y-ecoetiquetado.pdf"
    estado: disponible
  - titulo: "Sesión 9 — Huella de carbono del aguacate en el Ecuador"
    tipo: presentacion
    fuente: "Margarita Baquero (ponente invitada) · 13 de agosto"
    descripcion: >-
      Estudio de caso del proyecto CREA: cálculo con openLCA de la huella de
      carbono del aguacate ecuatoriano en seis fincas, desde el vivero hasta
      el consumo en Europa, con análisis de incertidumbre y de secuestro de
      carbono, comparación internacional y recomendaciones para productores y
      para la cadena de valor.
    url: "/materiales/modulo-5/sesion-9-huella-de-carbono-del-aguacate.pdf"
    estado: disponible
  - titulo: "Sesión 10 — Ecoetiquetado, tendencias internacionales y oportunidades para Ecuador"
    tipo: presentacion
    fuente: "Beatriz Rivela · 18 de agosto"
    descripcion: >-
      Las Declaraciones Ambientales de Producto en detalle y los programas que
      las gestionan, las tendencias internacionales en datos de ciclo de vida
      (GLAD y plataformas regionales) y un cierre sobre Ecuador: más de una
      década de avances, la reforma de 2023 en contratación pública y la hoja
      de ruta que queda por construir.
    url: "/materiales/modulo-5/sesion-10-ecoetiquetado-tendencias-y-oportunidades.pdf"
    estado: disponible
