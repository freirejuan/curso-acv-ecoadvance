numero: 5
slug: modulo-5
titulo: "Aplicaciones para la gestión pública"
subtitulo: "Del análisis a las políticas públicas sostenibles"
fechas: "13 de agosto (jueves) · 18 de agosto (martes)"
sesiones: "Dos sesiones"
acento: ambar
descripcion: >-
  En el módulo final ves cómo el ACV puede incorporarse a los procesos de
  formulación de políticas públicas y de contratación pública para promover un
  consumo y una producción más sostenibles. Conoces el papel del ACV como
  soporte de las Compras Públicas Sostenibles (CPS) y los principales
  instrumentos de comunicación ambiental —etiquetado ambiental Tipo I, II y
  III y Declaraciones Ambientales de Producto—, junto con experiencias
  internacionales que muestran oportunidades para el contexto ecuatoriano.
contenidos:
  - "Compras Públicas Sostenibles"
  - "Etiquetado ambiental Tipo I, II y III"
  - "Declaraciones Ambientales de Producto"
  - "Tendencias internacionales y oportunidades para Ecuador"
  - "Experiencias de otros países vinculando CPS y ACV"

