      - titulo: "Single-use supermarket food packaging and its alternatives: Recommendations from Life Cycle Assessments"
        url: "https://www.lifecycleinitiative.org/library/single-use-supermarket-food-packaging-and-its-alternatives-recommendations-from-life-cycle-assessments/"
        tipo: "Informe"
        idioma: "EN"
        dedicacion: "~45 min"
        descripcion: >-
