referencias:
  - titulo: "Software, bases de datos y estándares"
    items:
      - titulo: "openLCA"
        url: "https://www.openlca.org/"
        tipo: "Software"
        idioma: "EN"
        descripcion: >-
          Software libre y gratuito para la realización de estudios de ACV, con
          manuales, tutoriales en video y foro de soporte.
      - titulo: "Brightway"
        url: "https://docs.brightway.dev/projects/live/"
        tipo: "Software"
        idioma: "EN"
        descripcion: >-
          Framework de código abierto en Python para cálculos de ACV, cada vez
          más usado en investigación y en la práctica profesional junto a
          openLCA; este enlace lleva a una demo interactiva en el navegador
          (JupyterLite) para probarlo sin instalar nada.
      - titulo: "ecoinvent"
        url: "https://ecoinvent.org/"
        tipo: "Base de datos"
        idioma: "EN"
        descripcion: >-
          Base de datos internacional de referencia para inventarios de ciclo
          de vida, utilizada en estudios de ACV en todo el mundo.
      - titulo: "GLAD — Global LCA Data Access network"
        url: "https://www.oneplanetnetwork.org/resources-2/global-lca-data-network-glad-2/"
        tipo: "Base de datos"
        idioma: "EN"
        descripcion: >-
          El mayor directorio neutral de bases de datos de ACV del mundo,
          custodiado por la Life Cycle Initiative/PNUMA, que facilita el acceso
          e interoperabilidad de datos de inventario.
      - titulo: "Hoja de ruta para la creación de bases de datos nacionales de análisis del ciclo de vida"
        url: "https://www.lifecycleinitiative.org/wp-content/uploads/2020/06/INT_UNEP_LCA-Dev_Spanish_June-10_WEB.pdf"
        tipo: "Guía · PDF"
        dedicacion: "~45 min"
        descripcion: >-
          Guía de PNUMA (2020) con orientaciones para desarrollar bases de
          datos nacionales de ACV, que incluye el caso de Ecuador — uno de los
          países piloto del proyecto, junto con Uganda.
      - titulo: "Red Ecuatoriana de Ciclo de Vida y Economía Circular (RECOVER)"
        url: "https://www.linkedin.com/company/red-ecuatoriana-de-ciclo-de-vida-y-econom%C3%ADa-circular/"
        tipo: "Red"
        descripcion: >-
          Red de 17 organizaciones (academia, centros de investigación, sector
          empresarial) que agrupa la comunidad de práctica de ACV en Ecuador,
          coordinada en parte desde la ESPOL y conectada con la Life Cycle
          Initiative y la Red Iberoamericana de Ciclo de Vida.

