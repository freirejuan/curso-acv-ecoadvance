numero: 3
slug: modulo-3
titulo: "Herramientas y aplicaciones del ACV"
subtitulo: "Datos, software y casos prácticos"
fechas: "5 de agosto (miércoles) · 6 de agosto (jueves) · 11 de agosto (martes)"
sesiones: "Tres sesiones"
acento: naranja
descripcion: >-
  Este módulo lleva los conocimientos metodológicos a un plano práctico:
  conoces las principales bases de datos internacionales y el software
  especializado utilizado en las distintas etapas de un ACV, con ejercicios
  prácticos que te permiten familiarizarte con su funcionamiento. A través de
  estudios de caso, ves cómo el ACV se aplica en distintos sectores
  productivos, con especial atención a los de mayor relevancia para Ecuador.
contenidos:
  - "Bases de datos internacionales"
  - "Software especializado, con prácticas y ejercicios"
  - "Estudios de caso"
  - "Aplicaciones en sectores productivos relevantes para Ecuador"

