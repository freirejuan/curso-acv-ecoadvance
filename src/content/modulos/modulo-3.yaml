        dedicacion: "~30 min"
        descripcion: >-
          Meta-análisis de PNUMA/Life Cycle Initiative (2020) de 7 estudios de
          ACV que comparan bolsas plásticas de un solo uso con sus alternativas.
      - titulo: "Single-use plastic bottles and their alternatives: Recommendations from Life Cycle Assessments"
        url: "https://www.lifecycleinitiative.org/library/single-use-plastic-bottles-and-their-alternatives-recommendations-from-life-cycle-assessments/"
        tipo: "Informe"
        idioma: "EN"
        dedicacion: "~30 min"
        descripcion: >-
