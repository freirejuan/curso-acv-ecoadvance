      - titulo: "Addressing single-use plastic products pollution using a life cycle approach"
        url: "https://www.lifecycleinitiative.org/library/addressing-single-use-plastic-products-pollution-using-a-life-cycle-approach/"
        tipo: "Informe"
        idioma: "EN"
        dedicacion: "~30 min"
        descripcion: >-
          Informe "paraguas" de PNUMA que sintetiza la serie de meta-análisis
