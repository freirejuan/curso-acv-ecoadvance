descripcion: >-
  Este módulo introductorio te acerca a los conceptos fundamentales del
  Pensamiento de Ciclo de Vida y la Gestión de Ciclo de Vida, y a cómo este
  enfoque ayuda a comprender y gestionar los impactos ambientales, sociales y
  económicos de productos, servicios y organizaciones. También exploras su
  relación con la economía circular y los modelos de producción y consumo
  sostenibles, y su contribución a los Objetivos de Desarrollo Sostenible (ODS).
