resumen_cursos: "4 cursos · de ~1–2 h a 8 semanas; tres con opción gratuita"
cursos:
  - titulo: "Life Cycle Assessment"
    url: "https://www.coursera.org/learn/life-cycle-assessment"
    fuente: "Universidad de Michigan · Coursera"
    idioma: "EN · sub ES"
    coste: "Gratuito (auditoría)"
    dedicacion: "~12 h a tu ritmo"
    descripcion: >-
      Curso de la Universidad de Michigan (Coursera), impartido por Olivier
      Jolliet, uno de los cofundadores de la Life Cycle Initiative de PNUMA.
      Gratuito en modalidad auditoría (de pago solo si se desea certificado);
      recorre en profundidad las cuatro fases del ACV con un ejercicio práctico
      en SimaPro. En inglés, con subtítulos disponibles en varios idiomas,
      incluido el español.
  - titulo: "Sustainable innovations in enterprises: the life cycle assessment (LCA)"
    url: "https://www.open.edu/openlearn/money-business/sustainable-innovations-enterprises/content-section-3.2.1"
    fuente: "The Open University (Reino Unido) · OpenLearn"
    idioma: "EN"
    coste: "Gratuito"
    dedicacion: "~1–2 h"
    descripcion: >-
      Curso gratuito de la Open University (Reino Unido), con un enfoque
      aplicado a la toma de decisiones empresariales.
  - titulo: "Life Cycle Assessment: Quantifying Environmental Impacts"
    url: "https://professional.mit.edu/course-catalog/life-cycle-assessment-quantifying-environmental-impacts"
    fuente: "MIT Professional Education"
    idioma: "EN"
    coste: "De pago"
    dedicacion: "8 semanas"
    descripcion: >-
      Curso pagado de 8 semanas siguiendo el marco ISO 14040/14044, con
      certificado MIT. Opción avanzada para quienes busquen una certificación
      internacional de mayor profundidad.
  - titulo: "Life Cycle Assessment (LCA): Sustainability Principles (Part 1)"
    url: "https://www.futurelearn.com/courses/principles-of-life-cycle-assessment-for-sustainability"
    fuente: "Aberystwyth University · FutureLearn"
    idioma: "EN"
    coste: "Gratuito con acceso limitado"
    dedicacion: "4 semanas"
    descripcion: >-
      Curso de 4 semanas, con opción gratuita de acceso limitado o pago único.
      Introducción práctica al pensamiento de ciclo de vida y a las
      herramientas de evaluación del ACV.

referencias:
  - items:
      - titulo: "ISO 14040:2006 — Environmental management — Life cycle assessment — Principles and framework"
        url: "https://www.iso.org/standard/37456.html"
        tipo: "Norma"
        idioma: "EN"
        descripcion: >-
          Página oficial de ISO con el resumen y alcance de la norma que
          establece el marco de principios del ACV.
      - titulo: "ISO 14044:2006 — Environmental management — Life cycle assessment — Requirements and guidelines"
        url: "https://www.iso.org/standard/38498.html"
        tipo: "Norma"
        idioma: "EN"
        descripcion: >-
          Página oficial de ISO con los requisitos y directrices detalladas
          para las cuatro fases del ACV (con enmiendas de 2017 y 2020);
          complementa a la ISO 14040.
      - titulo: "Environmental Life Cycle Assessment"
        url: "https://www.taylorfrancis.com/books/oa-mono/10.1201/b19138/environmental-life-cycle-assessment-olivier-jolliet-alexandre-jolliet-shanna-shaked-pierre-crettaz-myriam-saade-sbeih"
        tipo: "Libro · acceso abierto"
        idioma: "EN"
        descripcion: >-
          Libro de texto de acceso abierto (CRC Press, 2016) sobre la
          metodología completa del ACV, escrito por Olivier Jolliet, el mismo
          autor del curso de Coursera recomendado en este módulo.
      - titulo: "GLAM — Global Guidance for Life Cycle Impact Assessment Indicators and Methods"
        url: "https://www.lifecycleinitiative.org/activities/life-cycle-assessment-data-and-methods/global-guidance-for-life-cycle-impact-assessment-indicators-and-methods-glam/"
        tipo: "Proyecto"
        idioma: "EN"
        descripcion: >-
          Proyecto de la Life Cycle Initiative (PNUMA) desde 2013, hoy en su
          versión GLAM 1.0 (lanzada en 2024), que constituye el método de
          referencia mundial para indicadores de evaluación de impacto en la
          fase de EICV.

presentaciones:
  - titulo: "Sesión 2 — Marco normativo y definición de objetivo y alcance"
    tipo: presentacion
    fuente: "Beatriz Rivela · 29 de julio"
    descripcion: >-
      Del pensamiento al análisis, definición y evolución del ACV, marco
      normativo ISO 14040/14044 y primera fase metodológica: objetivos,
      alcance, unidad funcional y límites del sistema.
    url: "/materiales/modulo-2/sesion-2-marco-normativo-objetivo-y-alcance.pdf"
    estado: disponible
  - titulo: "Sesión 3 — Límites del sistema y análisis de inventario"
    tipo: presentacion
    fuente: "Beatriz Rivela · 30 de julio"
    descripcion: >-
      Requisitos de calidad de los datos, diagramas de flujo y tipos de
      alcance (cuna a tumba, cuna a puerta, puerta a puerta), y entrada en la
      fase de análisis de inventario (ICV).
    url: "/materiales/modulo-2/sesion-3-limites-del-sistema-e-inventario.pdf"
    estado: disponible
  - titulo: "Taller relámpago — ¿Cuál es el impacto ambiental del consumo eléctrico de nuestros hogares?"
    tipo: presentacion
    fuente: "Beatriz Rivela · 30 de julio"
    descripcion: >-
      Dinámica en equipo de la sesión 3 para aplicar el enfoque de ciclo de
      vida al consumo eléctrico doméstico, partiendo de la factura de la luz
      de cada participante, y mirada al futuro con los escenarios de
      descarbonización de Ecuador a 2050 y 2070 y los materiales críticos que
      exigirá la transición energética.
    url: "/materiales/modulo-2/taller-relampago-consumo-electrico-hogares.pdf"
    estado: disponible
  - titulo: "Sesión 4 — Inventario, evaluación de impactos e interpretación"
    tipo: presentacion
    fuente: "Beatriz Rivela · 4 de agosto"
    descripcion: >-
      Bases de datos y calidad de los datos de inventario, categorías de
      impacto y métodos de evaluación (CML, ReCiPe, EF y GLAM), y la fase de
      interpretación de resultados para la toma de decisiones.
    url: "/materiales/modulo-2/sesion-4-inventario-impactos-e-interpretacion.pdf"
    estado: disponible
